# Fly.io deploy config for pathiel.
# Edit `app` to your chosen name; `flyctl launch` will offer a default.

app = "pathiel"
primary_region = "iad"  # change to a region near you

[build]
  dockerfile = "Dockerfile"

# Two processes share the image — this is scripts/restart.sh's process list,
# translated to Fly process groups (restart.sh itself does NOT run in the
# container; each process is launched directly so Fly supervises it):
#   web      — FastAPI server (dashboard + JSON API + /metrics). Claude trades
#              through the MCP server (scripts/pathiel-mcp-server.py), a
#              transient stdio process Claude Code respawns per tool call —
#              it has no long-running Fly process group of its own.
#   rotator  — scripts/log_rotate.py --daemon: truncates logs/*.log in place
#              on an interval and refuses new starts under the disk-guard
#              threshold (see pathiel/log_setup.py).
#
# 2026-10-23 (wave 2): the `loop` (scripts/trading_loop.py) and `sched`
# (scripts/scheduler.py) process groups this file used to declare are
# retired with the rest of the autonomous scan/research/execute engine —
# Claude is the only trader now, through the MCP server, not a standing
# process on this box.
[processes]
  web     = "env PATHIEL_STATE_READONLY=1 PATHIEL_HL_RATE_REFILL_PER_SEC=2 PATHIEL_HL_RATE_CAPACITY=60 python3 -m pathiel.server"
  rotator = "python3 scripts/log_rotate.py --daemon"

# `web` reads/writes state under /data (see the Dockerfile's "Runtime state"
# comment — PATHIEL_STATE_DIR). `rotator` only touches logs/ inside the
# container's own writable layer (deliberately NOT on the volume — log
# history isn't state that needs backup/rollback semantics, and letting it
# live outside the shared volume keeps the one singleton-sensitive volume
# smaller); it does not need the mount.
[[mounts]]
  source = "pathiel_data"   # `fly volumes create pathiel_data --size 1`
  destination = "/data"
  processes = ["web"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  # Shallow: is the web process serving.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/api/health"

  # Deep: is the SYSTEM working — AI brain readiness, equity floor, disk
  # headroom. Returns 503 when it is not, which is what should page someone.
  # Kept separate from the routing check above on purpose.
  [[http_service.checks]]
    grace_period = "120s"
    interval = "60s"
    method = "GET"
    timeout = "10s"
    path = "/api/health/system"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["rotator"]

[env]
  PATHIEL_PORT = "8000"
