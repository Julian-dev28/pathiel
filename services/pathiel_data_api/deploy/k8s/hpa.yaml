apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pathiel-data-api
  namespace: pathiel
  labels:
    app.kubernetes.io/name: pathiel-data-api
    app.kubernetes.io/part-of: pathiel-data-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pathiel-data-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
