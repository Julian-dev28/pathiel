name: Pool members

# No `paths`, `paths-ignore` or `branches` filter, and never the "_target"
# variant of this trigger that runs with the base branch's own workflow
# file against a fork's code and secrets:
#
# GitHub cannot scope a REQUIRED status check to a path. If this workflow
# only ran when something under pool/ changed, a pull request that touches
# no pool file would never get a "Pool members" run at all, and branch
# protection's "required status check" would then block every such pull
# request forever, waiting on a check that was never going to report. So
# this runs on every pull request; when nothing under pool/ changed it says
# so and exits 0 at once (no git history walk, no venue read).
#
# Plain pull_request: the job must evaluate the PULL REQUEST's own branch at
# its merge result to judge what that merge would do, not a trusted
# base-branch copy of the workflow running with repo secrets against
# untrusted fork code.
on:
  pull_request:

# Read-only: this job only ever reads the repository and the public
# Hyperliquid info endpoint (agent approval). It never writes a file, a
# status, a comment or a commit, so it needs nothing beyond `contents: read`.
# scripts/supply_chain_check.py fails the gate on any workflow that grants a
# write permission.
permissions:
  contents: read

jobs:
  test:
    name: Pool members
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 (full history) and no `ref:` override: the pull
      # request's own merge result is what gets checked out by default, and
      # the reinstated check needs the full history of pool/members/ and
      # pool/leaves/ to see every statement an address has ever held.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install (pinned)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      # Needs the venue: a join signed by an API wallet is checked against
      # Hyperliquid's extraAgents / userRole (read-only, no key). A failed
      # read is never treated as "not approved" (services/pool/approval.py);
      # it exits 2 instead, so the check reports a refusal, not a false pass.
      - name: Verify membership changes in this pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m services.pool verify --pr-base "origin/$BASE_REF"
