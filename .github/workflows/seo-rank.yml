name: SEO rank

# Weekly: where pathiel ranks in GitHub search for the queries a stranger
# types when looking for an AI trading agent (scripts/seo_rank.py). The table
# lands in the run summary. Read only: the search API needs no write scope,
# and nothing is committed. The baseline is in docs/seo/github_rank.jsonl.

on:
  schedule:
    - cron: "41 7 * * 1"   # Mondays 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank:
    name: GitHub search rank
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Rank
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/seo_rank.py | tee -a "$GITHUB_STEP_SUMMARY"
