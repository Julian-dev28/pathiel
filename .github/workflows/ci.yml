name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      # Install the EXACT pinned set, not a fresh resolve of the ranges in
      # pyproject.toml. A green CI against a different dependency set than
      # production runs is not evidence about production.
      - name: Install (pinned)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      # This repo was green locally and red on CI for weeks because 50 files
      # hardcoded /Users/julian_dev/... Cheap check, runs before the suite so
      # the failure names the actual cause instead of a FileNotFoundError.
      - name: No machine-bound absolute paths
        run: python scripts/check_no_absolute_paths.py

      # pathiel/static/wallet.js is a build artifact committed to the repo,
      # which is safe only because `build.mjs --check` fails when it is stale.
      # That check needs esbuild, so CI has to install it — without this the
      # test ran, could not find the package, and failed for a reason that had
      # nothing to do with whether the bundle was current.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/wallet_ui/package-lock.json

      - name: Install wallet-bundle toolchain
        working-directory: services/wallet_ui
        run: npm ci

      # pytest's addopts deselects the `online` and `live` markers, so this runs
      # only the offline suite — no network, no real-money orders, CI-safe.
      - name: Run offline test suite
        run: pytest
