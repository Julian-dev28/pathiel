name: CI

on:
  push:
  pull_request:

# The job reads the repo and nothing else. Without this block GITHUB_TOKEN gets
# the repository's default, which can be read/write on every scope: a step
# compromised through a dependency could then push, tag or open releases.
permissions:
  contents: read

# Actions are pinned to a full commit SHA, not a tag. A tag is a pointer the
# action's owner (or whoever holds their token) can move; tj-actions/changed-
# files (March 2025, CVE-2025-30066) moved every tag to a payload that printed
# runner secrets. The comment names the release the SHA was taken from;
# tests/test_supply_chain.py fails on any `uses:` that is not a 40-hex SHA.

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the desk runs on (the operator's .venv, 2026-10-25);
        # 3.11 is the floor pyproject declares. A green matrix that skips the
        # production interpreter is not evidence about production.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      # Install the EXACT pinned set, not a fresh resolve of the ranges in
      # pyproject.toml. A green CI against a different dependency set than
      # production runs is not evidence about production.
      - name: Install (pinned)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      # This repo was green locally and red on CI for weeks because 50 files
      # hardcoded /Users/julian_dev/... Cheap check, runs before the suite so
      # the failure names the actual cause instead of a FileNotFoundError.
      - name: No machine-bound absolute paths
        run: python scripts/check_no_absolute_paths.py

      # pathiel/static/wallet.js is a build artifact committed to the repo,
      # which is safe only because `build.mjs --check` fails when it is stale.
      # That check needs esbuild, so CI has to install it — without this the
      # test ran, could not find the package, and failed for a reason that had
      # nothing to do with whether the bundle was current.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/wallet_ui/package-lock.json

      # --ignore-scripts: no dependency's install hook runs on this runner.
      # Lifecycle scripts are how Shai-Hulud (2025) and MALFEX (2026) ran on
      # install; nothing in this tree needs one (esbuild's binary comes from
      # its optional @esbuild/linux-x64 package). services/wallet_ui/.npmrc
      # sets the same default for a developer's `npm ci`.
      - name: Install wallet-bundle toolchain
        working-directory: services/wallet_ui
        run: npm ci --ignore-scripts

      # Every installed tarball carries a valid npm registry signature
      # (fails on a tampered or mirror-substituted package).
      - name: Verify npm registry signatures
        working-directory: services/wallet_ui
        run: npm audit signatures

      # Rebuild the bundle from the lockfile and require it to be byte-identical
      # to the committed pathiel/static/wallet.js + wallet.css, shipping exactly
      # the packages bundle.manifest.json lists. The gate suite's --check only
      # compares hashes; this proves the committed bytes came from the sources.
      - name: Wallet bundle reproduces from the lockfile
        working-directory: services/wallet_ui
        run: node build.mjs --verify

      # pytest's addopts deselects the `online` and `live` markers, so this runs
      # only the offline suite — no network, no real-money orders, CI-safe.
      # -rs prints the reason for every skip. Without it the summary says
      # "18 skipped" and nothing else, so a guard that quietly stopped running
      # in this environment looks exactly like a green build.
      - name: Run offline test suite
        run: pytest -rs
