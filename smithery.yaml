# Smithery listing for the pathiel MCP server. Not submitted; the maintainer
# submits it. It builds the same container as the MCP registry listing
# (Dockerfile.mcp), which runs the public launcher scripts/pathiel-mcp.
# No key is configured here: keys live only in the user's own env file.
build:
  dockerfile: Dockerfile.mcp
  dockerBuildPath: .
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      network:
        type: string
        enum: [testnet, mainnet]
        default: testnet
        description: Hyperliquid network. testnet is the default; mainnet trades real money.
  commandFunction: |-
    (config) => ({
      command: '/app/scripts/pathiel-mcp',
      args: [],
      env: { PATHIEL_NETWORK: config.network || 'testnet' }
    })
  exampleConfig:
    network: testnet
