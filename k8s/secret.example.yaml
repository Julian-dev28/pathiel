# Reference only — DO NOT commit a filled-in copy.
#
# Preferred: create the Secret straight from your gitignored .env.local so keys
# never touch a tracked file:
#
#   kubectl create secret generic pathiel-secrets -n pathiel \
#     --from-literal=HYPERLIQUID_WALLET_ADDRESS="$HYPERLIQUID_WALLET_ADDRESS" \
#     --from-literal=HYPERLIQUID_PRIVATE_KEY="$HYPERLIQUID_PRIVATE_KEY" \
#     --from-literal=HYPERLIQUID_MASTER_ADDRESS="$HYPERLIQUID_MASTER_ADDRESS" \
#     --from-literal=PATHIEL_OPERATOR_TOKEN="$(openssl rand -hex 16)"
#
# For a pure screenshot demo you can use dummy values — the server boots in
# OFF mode and serves the Desk pages without a tradable account.
#
# The four keys above are REQUIRED — every container reads this Secret via
# envFrom, and a missing HYPERLIQUID_* / PATHIEL_OPERATOR_TOKEN degrades a real
# feature (order placement, the operator surface) rather than failing to boot.
# There is no LLM key: the desk thesis writer runs through the operator's
# local Claude Code CLI, never from the cluster. Everything below is OPTIONAL:
# add a --from-literal for each one you actually use; a source whose key is
# unset is skipped and the desk brief's `stale` list says so. See
# docs/SECRETS.md for what each one unlocks.
apiVersion: v1
kind: Secret
metadata:
  name: pathiel-secrets
  namespace: pathiel
type: Opaque
stringData:
  # ── Required ──────────────────────────────────────────────────────────────
  HYPERLIQUID_WALLET_ADDRESS: "0xREPLACE_ME"
  HYPERLIQUID_PRIVATE_KEY: "0xREPLACE_ME"
  HYPERLIQUID_MASTER_ADDRESS: "0xREPLACE_ME"
  PATHIEL_OPERATOR_TOKEN: "REPLACE_ME"
  # ── Optional: services/intel data keys (free, read-only) ──────────────────
  # EIA_API_KEY: "REPLACE_ME"          # US crude and gas inventories
  # FRED_API_KEY: "REPLACE_ME"         # rates, dollar, inflation series
  # CONGRESS_API_KEY: "REPLACE_ME"     # bills in the policy block
  # ── Never in a cluster ────────────────────────────────────────────────────
  # HYPERLIQUID_MASTER_PRIVATE_KEY     # scripts/treasury.py transfers only, laptop-only;
  #                                    # preflight_secrets.py --deploy fails if it is set
