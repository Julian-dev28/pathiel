apiVersion: v1
kind: ConfigMap
metadata:
  name: pathiel-config
  namespace: pathiel
# Non-secret runtime config. Secrets — the wallet key, the operator token —
# live in the `pathiel-secrets` Secret, NOT here. The /data path env vars
# (PATHIEL_STATE_DIR, SESSION_LOG_PATH, PATHIEL_AGENT_CONFIG_FILE) and
# PATHIEL_BIND are baked into the image (see Dockerfile) so every container
# already agrees on where shared state lives and how the server binds — they
# do not need to be repeated here. Per-process overrides (the `web`
# container's throttled HL rate-limit budget + PATHIEL_STATE_READONLY) live on
# that one container's `env:` in statefulset.yaml, since a ConfigMap is shared
# by every container in the pod and can't vary per-container.
#
# PATHIEL_AUTH_DOMAIN must match the host the browser is on, or every wallet
# sign-in is rejected for a domain mismatch (services/auth). The default is
# right for the port-forward in k8s/README.md; set the real host for anything
# reachable from outside the cluster.
#
# PATHIEL_AUTH_NO_BOOTSTRAP_OPERATOR=1: on a fresh database the first wallet
# to sign in would otherwise claim the operator role (security review
# 2026-10-25, P2-6). A deployment never relies on being first: grant the role
# from inside the pod with `python scripts/grant_operator.py 0xYourWallet`.
data:
  PATHIEL_PORT: "8000"
  PATHIEL_AUTH_DOMAIN: "localhost:8000"
  PATHIEL_AUTH_NO_BOOTSTRAP_OPERATOR: "1"
