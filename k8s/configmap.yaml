apiVersion: v1
kind: ConfigMap
metadata:
  name: pathiel-config
  namespace: pathiel
# Non-secret runtime config (mirrors fly.toml [env]). Secrets — API keys, the
# wallet key, the operator token — live in the `pathiel-secrets` Secret, NOT
# here. The /data path env vars (PATHIEL_STATE_DIR, PATHIEL_POSITIONS_SNAPSHOT_FILE,
# SESSION_LOG_PATH, PATHIEL_DSL_STATE_FILE, PATHIEL_AGENT_CONFIG_FILE,
# PATHIEL_AGENT_MEMORY_FILE), PATHIEL_BIND, and AI_BRAIN_PROVIDER are baked into
# the image (see Dockerfile) so every container already agrees on where
# shared state lives and how the server binds — they do not need to be
# repeated here. Per-process overrides (the `web` container's throttled HL
# rate-limit budget + PATHIEL_STATE_READONLY) live on that one container's
# `env:` in statefulset.yaml, since a ConfigMap is shared by every container
# in the pod and can't vary per-container.
data:
  PATHIEL_PORT: "8000"
  PATHIEL_SCAN_INTERVAL: "60"
