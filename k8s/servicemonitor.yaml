# Operator-native scrape config. Requires the Prometheus Operator CRDs, which
# kube-prometheus-stack installs — so apply this AFTER `helm install`.
#
# The `release` label must match your kube-prometheus-stack Helm release name;
# by default the stack's Prometheus only selects ServiceMonitors carrying it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pathiel
  namespace: pathiel
  labels:
    app: pathiel
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: pathiel
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # If pathiel-secrets sets PATHIEL_METRICS_TOKEN, /metrics answers 401
      # without it. Uncomment so the scraper sends it (the secret must live
      # in the ServiceMonitor's namespace):
      # bearerTokenSecret:
      #   name: pathiel-secrets
      #   key: PATHIEL_METRICS_TOKEN
