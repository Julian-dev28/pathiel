# Alerts for the failures, not the happy path.
#
# An unrotated disk, a dead AI brain and a deep drawdown each went unnoticed
# for weeks before these rules existed. Every rule below corresponds to a
# silent failure this system has actually had.
#
# 2026-10-25: PathielBrainUnusable is gone with the AI brain module it
# watched (pathiel/agents/ai_brain.py, deleted; the desk thesis writer goes
# through services/llm and has no standing provider to probe).
#
# 2026-10-23 (wave 2): the autonomous scan/research/execute engine is
# retired, so the rules that watched IT are gone too — PathielLoopDead (the
# trading loop's heartbeat), PathielFeedDegraded (the scanner's feed
# integrity), PathielSupervisionStale and PathielAlertingStale (the process
# supervisor and `scripts/alert_eval.py`, both scheduler jobs for a bot that
# no longer runs). Keeping them would mean every one of these fires forever,
# which is a false page, not a real one — the same reasoning that dropped
# GRADING_AGE/PathielGradingStale in wave 1. `scripts/alert_eval.py` itself
# is deleted with them; apply this file with the rest of k8s/ (requires the
# Prometheus Operator, same dependency as servicemonitor.yaml) — there is no
# longer a local/Mac evaluator for it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pathiel
  labels:
    app: pathiel
spec:
  groups:
    - name: pathiel.silent-failures
      rules:
        # LIVE mode against an account that cannot place an order. Harmless
        # because place_bracket refuses, but it means the config says something
        # the system cannot do.
        - alert: PathielLiveButCannotTrade
          expr: pathiel_live_mode == 1 and pathiel_can_trade == 0
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Mode is LIVE but equity is below the structural minimum"
            description: >-
              place_bracket refuses every order under the dust floor. Either fund
              the account or take it out of LIVE so the config matches reality.

        # An unrotated log directory took this system down before anything else
        # noticed it was low.
        - alert: PathielDiskLow
          expr: pathiel_disk_free_bytes < 2e9
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: "Under 2GB free on the state filesystem"
            description: >-
              restart.sh refuses to start a process below the critical floor.
              Check `python scripts/log_rotate.py --guard`.

        - alert: PathielLogDirOversized
          expr: pathiel_log_dir_bytes > 8e8
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "logs/ is over 800MB despite rotation"
            description: >-
              The rotator should hold this under its directory cap. If it is
              growing anyway the rotator is not running.

        # The evidence base under every desk's track record is gitignored and
        # sits on one disk. 36h, not 24h, so one skipped daily run is not a page.
        - alert: PathielBackupStale
          expr: pathiel_backup_age_seconds > 129600
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "No verified state backup in {{ $value | humanizeDuration }}"
            description: >-
              .agent-config.json, capital_flows.jsonl and the desk journals
              have no current copy. An UNVERIFIED archive counts as no backup
              here. Run `python scripts/backup_state.py`.

        # Not a system fault — a money fault. Worth a human looking.
        - alert: PathielDeepDrawdown
          expr: pathiel_max_drawdown_pct < -25
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "Max drawdown {{ $value }}% over the risk window"
            description: >-
              Flow-neutral where capital flows are recorded, so this is not a
              withdrawal. Review before adding capital.
