apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pathiel
  namespace: pathiel
  labels:
    app: pathiel
spec:
  serviceName: pathiel
  # replicas is 1 ON PURPOSE — `web` writes state files to the shared volume
  # and is a singleton by design. This is why it's a StatefulSet (stable
  # identity + its own PVC), not a Deployment.
  #
  # 2026-10-23 (wave 2): the `loop` (scripts/trading_loop.py) and `sched`
  # (scripts/scheduler.py) containers this manifest used to run are retired
  # with the rest of the autonomous scan/research/execute engine — Claude is
  # the only trader now, through the MCP server (a transient stdio process
  # Claude Code respawns per tool call, not a container in this StatefulSet).
  replicas: 1
  selector:
    matchLabels:
      app: pathiel
  template:
    metadata:
      labels:
        app: pathiel
      annotations:
        # Fallback for annotation-based Prometheus scrape configs. The
        # operator-native path is k8s/servicemonitor.yaml.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # fsGroup so the mounted PVC is group-writable for state files. No
      # container here sets runAsUser (they all run as the image's default,
      # root), so this is currently a no-op — kept for forward compat if a
      # future hardening pass adds a non-root user to the Dockerfile.
      securityContext:
        fsGroup: 1000
      containers:
        # ── web: FastAPI dashboard + JSON API + /metrics ──────────────────────
        - name: web
          image: pathiel:local
          imagePullPolicy: IfNotPresent
          # No `command:` — falls through to the image's ENTRYPOINT
          # (docker-entrypoint.sh), which bootstraps /data/.state then execs
          # `args`. See Dockerfile "Runtime state" for why that step exists.
          args: ["python3", "-m", "pathiel.server"]
          env:
            # Mirrors scripts/restart.sh's start_server(): a throttled HL
            # token bucket and readonly state mode for the dashboard process.
            - name: PATHIEL_STATE_READONLY
              value: "1"
            - name: PATHIEL_HL_RATE_REFILL_PER_SEC
              value: "2"
            - name: PATHIEL_HL_RATE_CAPACITY
              value: "60"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pathiel-config
            - secretRef:
                name: pathiel-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          # Readiness answers "should traffic go here", so it uses the DEEP
          # check: a pod whose disk is below the critical floor or whose
          # state volume did not mount should not be presented as a working
          # system. (2026-10-25: the loop/feed/AI-brain checks that could
          # never pass in a headless deploy are gone from that route.)
          readinessProbe:
            httpGet:
              path: /api/health/system
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Liveness answers "is THIS process wedged", and must stay on the
          # shallow check — a deep-check failure elsewhere must not restart
          # the one process that can show what happened.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        # ── rotator: scripts/log_rotate.py --daemon ─────────────────────────────
        # Truncates logs/*.log in place on an interval so a long-lived pod's
        # logs/ doesn't grow unbounded; see pathiel/log_setup.py for the
        # policy. Logs live in the container's own writable layer,
        # deliberately NOT on the shared /data volume — log history isn't
        # state that needs the same backup/rollback guarantees as .state/,
        # and keeping it off the volume keeps the one singleton-sensitive
        # PVC smaller. No probe: a process crash is the failure signal
        # (restartPolicy Always restarts it).
        - name: rotator
          image: pathiel:local
          imagePullPolicy: IfNotPresent
          args: ["python3", "scripts/log_rotate.py", "--daemon"]
          envFrom:
            - configMapRef:
                name: pathiel-config
            - secretRef:
                name: pathiel-secrets
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
