<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <title>How the pathiel pieces fit together</title>
  <desc>Operator talks to Claude Code, which calls the pathiel MCP server to read Hyperliquid and place orders. The server also triggers the local Claude CLI to write the desk thesis into the journal, which desk_brief reads back. A /loop timer re-prompts Claude Code every tick. The Desk page reads the same state without placing orders.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#92400e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <!-- A: Operator -->
  <rect x="40" y="24" width="220" height="56" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="150" y="47" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Operator (you)</text>
  <text x="150" y="65" text-anchor="middle" font-size="11" fill="#1f2937">types prompts, approves live-money calls</text>

  <!-- B: Claude Code -->
  <rect x="40" y="140" width="260" height="76" rx="8" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
  <text x="170" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Claude Code</text>
  <text x="170" y="183" text-anchor="middle" font-size="11" fill="#1e1b4b">the workbench</text>
  <text x="170" y="200" text-anchor="middle" font-size="11" fill="#1e1b4b">one MCP client, registered via .mcp.json</text>

  <!-- C: MCP server -->
  <rect x="400" y="140" width="280" height="76" rx="8" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
  <text x="540" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">pathiel MCP server</text>
  <text x="540" y="181" text-anchor="middle" font-size="11" fill="#1e1b4b">scripts/pathiel-mcp-server.py, 60 tools</text>
  <text x="540" y="198" text-anchor="middle" font-size="11" fill="#1e1b4b">stdio, inside your permissions and risk limits</text>

  <!-- D: Hyperliquid venue -->
  <rect x="770" y="140" width="190" height="76" rx="8" fill="#fff3e0" stroke="#92400e" stroke-width="1.5"/>
  <text x="865" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#5c2d00">Hyperliquid venue</text>
  <text x="865" y="181" text-anchor="middle" font-size="11" fill="#5c2d00">live account, real money</text>
  <text x="865" y="198" text-anchor="middle" font-size="11" fill="#5c2d00">xyz:BRENTOIL (HIP-3)</text>

  <!-- E: local Claude CLI -->
  <rect x="400" y="280" width="280" height="76" rx="8" fill="#eafaf0" stroke="#15803d" stroke-width="1.5"/>
  <text x="540" y="303" text-anchor="middle" font-size="14" font-weight="600" fill="#0b3b22">Local Claude CLI</text>
  <text x="540" y="321" text-anchor="middle" font-size="11" fill="#0b3b22">the judgment: writes the thesis</text>
  <text x="540" y="338" text-anchor="middle" font-size="11" fill="#0b3b22">services/llm, services/thesis - no hosted API</text>

  <!-- F: journal -->
  <rect x="400" y="400" width="280" height="64" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="540" y="423" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Thesis + trade journal</text>
  <text x="540" y="441" text-anchor="middle" font-size="11" fill="#1f2937">.state/strategies/oil/{theses,trades}</text>

  <!-- G: desk-tick loop -->
  <rect x="40" y="400" width="260" height="76" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="170" y="423" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">desk-tick loop</text>
  <text x="170" y="441" text-anchor="middle" font-size="11" fill="#1f2937">/loop 15m /desk-tick oil</text>
  <text x="170" y="458" text-anchor="middle" font-size="11" fill="#1f2937">nothing trades between ticks</text>

  <!-- H: Desk page -->
  <rect x="740" y="400" width="220" height="76" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="850" y="423" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Desk page</text>
  <text x="850" y="441" text-anchor="middle" font-size="11" fill="#1f2937">localhost:8000, read-only</text>
  <text x="850" y="458" text-anchor="middle" font-size="11" fill="#1f2937">same call and position, no order button</text>

  <!-- arrows -->
  <line x1="150" y1="80" x2="150" y2="138" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="300" y1="178" x2="398" y2="178" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="398" y1="190" x2="300" y2="190" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="349" y="168" text-anchor="middle" font-size="10" fill="#374151">tool calls</text>
  <text x="349" y="206" text-anchor="middle" font-size="10" fill="#374151">results</text>

  <line x1="680" y1="178" x2="768" y2="178" stroke="#92400e" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="724" y="168" text-anchor="middle" font-size="10" fill="#92400e">reads + orders</text>

  <line x1="540" y1="216" x2="540" y2="278" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="250" text-anchor="middle" font-size="10" fill="#374151">desk_refresh</text>

  <line x1="540" y1="356" x2="540" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="382" text-anchor="middle" font-size="10" fill="#374151">writes the thesis</text>

  <path d="M 400 432 C 320 432, 320 230, 398 190" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#374151" transform="rotate(-90 300 300)">desk_brief reads it back</text>

  <line x1="170" y1="398" x2="170" y2="218" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="105" y="310" text-anchor="middle" font-size="10" fill="#374151" transform="rotate(-90 105 310)">re-prompts on a timer</text>

  <line x1="800" y1="216" x2="850" y2="398" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="862" y="310" text-anchor="middle" font-size="10" fill="#374151" transform="rotate(68 862 310)">shows the same state</text>
</svg>
