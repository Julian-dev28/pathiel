services:
  hermes-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-trader
    volumes:
      - .env.local:/app/.env.local:ro
      - .agent-config.json:/app/.agent-config.json:ro
      - ./trader-logs:/app/log:rw
      # A/B model-duel log (duel_store.py appends; HERMES_DUEL_FILE below).
      # Directory mount per the EBUSY rule; the file is pre-created host-side
      # (scripts/build.sh) so append-only writes work.
      - ./duel-logs:/app/duel-logs:rw
      # Decision-voice observer log (decision_voice.py appends; HERMES_DV_FILE
      # below) — same directory-mount pattern as duel-logs: the shadow
      # accrual must survive rebuilds/recreates or the offline join has no data.
      - ./dv-logs:/app/dv-logs:rw
      # Persistent HF model cache so Chronos-2 loads from disk (no re-download
      # on rebuild/restart). Seeded from the container on first use.
      - ./hf-cache:/home/trader/.cache/huggingface:rw
      # Persistent agent state: memory / DSL exit ratchets / positions snapshot.
      # Must be a DIRECTORY volume, not a single-file mount: the code persists
      # via os.replace(), which fails over a file bind-mount (EBUSY). The
      # HERMES_*_FILE overrides below point the loop at /data so a
      # --force-recreate no longer wipes operational state (cooldowns, the
      # realized-outcome store, SOD equity baseline, and open-position
      # stop/trailing-TP ratchets held in .dsl-state.json).
      - ./agent-state:/data:rw
    env_file:
      - .env.local
    environment:
      - HERMES_AGENT_MEMORY_FILE=/data/.agent-memory.json
      - HERMES_DSL_STATE_FILE=/data/.dsl-state.json
      - HERMES_POSITIONS_SNAPSHOT_FILE=/data/.positions-snapshot.json
      # Model-duel A/B log — on a bind mount so it survives rebuilds
      # (default ~/.hermes-trader-duel.jsonl sits on the writable layer).
      - HERMES_DUEL_FILE=/app/duel-logs/hermes-trader-duel.jsonl
      # Decision-voice shadow log — same reason (clef-gate accrual join reads
      # this after recreates).
      - HERMES_DV_FILE=/app/dv-logs/hermes-trader-dv.jsonl
    networks:
      - llama-net
    restart: unless-stopped

  # systemone PRIMARY seat (2026-10-13): llama.cpp MASTER serving
  # ggml-org/vllm-d3-nano-GGUF Q8_0 via POST /v1/systemone. lemonade's
  # bundled llama.cpp predates d3 support (upstream PRs #30383/#30408), so
  # this runs the sm_89 master build at ~/llama-master/build (built in
  # nvidia/cuda:12.8.1-devel-ubuntu22.04). Dedicated container + restart
  # policy = the persistence fix the clef :8080 setsid never had (it died
  # on every lemonade recreate). Serving flags proven on the 1.16 A/B box:
  # --embeddings --pooling none is the decision-model mode; -b/-ub 8192
  # covers the bot's state JSON in one batch (embedding mode 500s when the
  # state exceeds the physical batch size). VRAM: nano Q8 + KV ~3 GB on top
  # of the 27B IQ2_XS-mtp (~12.5 GB) — fits with clef evicted.
  nano-serve:
    image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    container_name: nano-serve
    # The build tree's baked rpath points at the BUILD container's /src/build
    # (not this mount's /srv) — same fix the 1.16 decision2-serve used.
    environment:
      - LD_LIBRARY_PATH=/srv/bin
    command: /srv/bin/llama-server
      -m /hf/hub/models--ggml-org--vllm-d3-nano-GGUF/snapshots/67baf946c0042cd74ca7106929ed57db699a5f4b/vllm-d3-nano-Q8_0.gguf
      --embeddings --pooling none -c 4096 -b 2048 -ub 2048 -np 1
      --cache-type-k q8_0 --cache-type-v q8_0 -ngl 14
      --host 0.0.0.0 --port 8080
    volumes:
      - /home/oknight/llama-master/build:/srv:ro
      - /home/oknight/.cache/huggingface:/hf:ro
    networks:
      - llama-net
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  llama-net:
    external: true
